<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d1d1d">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Car Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/myCSS.css" />
</head>
<body>
    <div class="container-fluid py-3" style="background-color: #1d1d1d; border-bottom: 2px solid #202020; 
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);">
        <div class="text-center">
            <img src="images/logo2.png" alt="Logo" style="height:80px; margin-bottom: 10px;">
            <h1 style="color: #ffffff;">Car Management</h1>
        </div>
    </div>

    <div id="remindersSection" class="container mt-4 text-center">
        <h3>Your Reminders <i class="fa-regular fa-clock"></i></h3>
        <div id="filterBtn" class="d-flex justify-content-center my-3">
            <button id="openFilter" class="btn btn-outline-secondary d-flex align-items-center" type="button">
                <i class="fa-solid fa-filter me-2"></i> Filter
            </button>
        </div>
        <div id="carButtonsBar" class="my-3"></div>
        <ul id="remindersList" class="list-group" style="min-height:80px;position:relative;">
            <div id="remindersLoader" style="display:flex; align-items:center; justify-content:center; position:absolute; top:0; left:0; width:100%; height:100%; z-index:10; background:rgba(255,255,255,0.8);">
                <div class="text-center w-100">
                    <div class="spinner-border" role="status" style="width:2rem;height:2rem;color:#222;"></div>
                    <p class="mt-2" style="color:#222;">Loading reminders...</p>
                </div>
            </div>
        </ul>
    </div>

    <div class="floating-buttons flex-column align-items-center" style="display:none;">
        <button type="button" class="btn btn-dark my-2" data-target="addcar.html">Add Car</button>
        <button type="button" class="btn btn-dark my-2" data-target="setReminder.html">Set Reminder</button>
        <button type="button" class="btn btn-dark my-2" data-target="scheduleMaintenance.html">Schedule Maintenance</button>
    </div>

    <footer class="fixed-bottom bg-light py-2 border-top">
        <div class="container">
            <div class="row justify-content-center text-center footer-row">
                <!-- Reminder Button -->
                <div class="col-auto">
                    <a href="index.html" class="btn btn-link text-secondary footer-btn d-flex flex-column align-items-center justify-content-center" style="text-decoration: none;">
                        <i class="fa-solid fa-clock" style="margin-bottom: 2px;"></i>
                        <div style="margin-top: 2px;">Reminders</div>
                    </a>
                </div>
                <!-- Garage Button -->
                <div class="col-auto">
                    <a href="pages/garage.html" class="btn btn-link text-secondary footer-btn d-flex flex-column align-items-center justify-content-center" style="text-decoration: none;">
                        <i class="fa-solid fa-car" style="margin-bottom: 2px;"></i>
                        <div>Garage</div>
                    </a>
                </div>
                <!-- Messages Button -->
                <div class="col-auto">
                    <a href="pages/messages.html" class="btn btn-link text-secondary footer-btn d-flex flex-column align-items-center justify-content-center" style="text-decoration: none;">
                        <i class="fa-solid fa-message" style="margin-bottom: 2px;"></i>
                        <div>Messages</div>
                    </a>
                </div>
                <div class="col-auto">
                    <a href="pages/definitions.html" class="btn btn-link text-secondary footer-btn d-flex flex-column align-items-center justify-content-center" style="text-decoration: none;">
                        <i class="fa-solid fa-gear" style="margin-bottom: 2px;"></i>
                        <div>Settings</div>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <a href="#" id="plusBtn" class="btn btn-dark rounded-circle plus-btn">
        <i class="fa-solid fa-plus fa-lg"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script type="module" src="js/checkAuth.js"></script>
    <script src="js/plusbtn.js"></script>
    <script type="module" src="js/reminders.js"></script>
    <script src="js/notifications.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
</body>
</html>
