<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#1d1d1d">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Management - Authentication</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/myCSS.css">
    <style>
        .form-container {
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-3" style="background-color: #1d1d1d; border-bottom: 2px solid #202020; 
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);">
        <div class="text-center">
            <img src="../images/logo2.png" alt="Logo" style="height:80px; margin-bottom: 10px;">
            <h1 style="color: #ffffff;">Car Management</h1>
        </div>
    </div>
    <div class="container py-5">
        
        <div class="form-container">
            <form id="login-form" class="needs-validation" novalidate>
                <h2>Login</h2>
                <div class="mb-3">
                  <input type="email" class="form-control" id="login-email" placeholder="Email" required>
                  <div class="invalid-feedback">
                    Please provide a valid email.
                  </div>
                </div>
                <div class="mb-3">
                  <input type="password" class="form-control" id="login-password" placeholder="Password" required minlength="6">
                  <div class="invalid-feedback">
                    Password must be at least 6 characters.
                  </div>
                </div>
                <button type="submit" class="btn btn-dark" id="login-btn">Login</button>
                <p class="mt-2">Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
            </form>

            <form id="signup-form" class="needs-validation" novalidate style="display: none;">
                <h2>Sign Up</h2>
                <div class="mb-3">
                  <input type="email" class="form-control" id="signup-email" placeholder="Email" required>
                  <div class="invalid-feedback">
                    Please provide a valid email.
                  </div>
                </div>
                <div class="mb-3">
                  <input type="password" class="form-control" id="signup-password" placeholder="Password" required minlength="6">
                  <div class="invalid-feedback">
                    Password must be at least 6 characters.
                  </div>
                </div>
                <button type="submit" class="btn btn-success" id="signup-btn">Sign Up</button>
                <p class="mt-2">Already have an account? <a href="#" id="show-login">Login</a></p>
            </form>
        </div>
    </div>
    
    <script src="../js/controllers/auth.js" type="module"></script>
    <script type="module">
        import { signUp, login } from './js/auth.js';

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const showSignupLink = document.getElementById('show-signup');
            const showLoginLink = document.getElementById('show-login');
            const loginBtn        = document.getElementById('login-btn');
            const signupBtn       = document.getElementById('signup-btn');

            showSignupLink.addEventListener('click', (e) => {
                e.preventDefault();
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            });

            showLoginLink.addEventListener('click', (e) => {
                e.preventDefault();
                signupForm.style.display = 'none';
                loginForm.style.display = 'block';
            });

            loginForm.addEventListener('submit', async e => {
                e.preventDefault();
                if (!loginForm.checkValidity()) {
                    loginForm.classList.add('was-validated');
                    return;
                }
                loginBtn.disabled = true;
                try {
                    const email = loginForm['login-email'].value;
                    const password = loginForm['login-password'].value;
                    await login(email, password);
                    window.location.href = "../index.html";
                } catch (err) {
                    alert('Failed to login: ' + err.message);
                } finally {
                    loginBtn.disabled = false;
                }
            });

            signupForm.addEventListener('submit', async e => {
                e.preventDefault();
                if (!signupForm.checkValidity()) {
                    signupForm.classList.add('was-validated');
                    return;
                }
                signupBtn.disabled = true;
                try {
                    const email = signupForm['signup-email'].value;
                    const password = signupForm['signup-password'].value;
                    await signUp(email, password);
                    window.location.href = "../index.html";
                } catch (err) {
                    alert('Failed to sign up: ' + err.message);
                } finally {
                    signupBtn.disabled = false;
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/services/notifications.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
</body>
</html>
